<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Projeto enviado | Novari</title>
  <link rel="stylesheet" href="configurador.css">
  <style>
    .enviado { min-height: calc(100vh - var(--header-h)); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .enviado-box { max-width: 520px; text-align: center; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 40px 28px; }
    .enviado-box h1 { font-family: var(--serif); font-weight: 400; color: var(--text); margin: 12px 0; }
    .enviado-box p { color: var(--text-soft); line-height: 1.6; margin: 0 0 24px; }
    .enviado-box .primary-btn { display: inline-flex; align-items: center; justify-content: center; padding: 0 24px; text-decoration: none; }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo" aria-label="Voltar ao início">
      <img src="336cde02-b99b-4cbc-947d-d282ff741cb1.png" alt="Logo Novari">
    </a>
    <a href="index.html" class="voltar">← Voltar ao site</a>
  </header>
  <main class="enviado">
    <div class="enviado-box">
      <span class="eyebrow">PROJETO ENVIADO</span>
      <h1>Obrigado!</h1>
      <p>A Novari recebeu o seu projeto, com as medidas e as imagens 3D. Entraremos em contacto em breve.</p>
      <a class="primary-btn" href="index.html">Voltar ao site</a>
    </div>
  </main>
</body>
</html>
